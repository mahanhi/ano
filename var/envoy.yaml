# Generated by Ano. Only approved drop and allow_envoy routes are listed.
# Direct allows and suggestions are omitted on purpose.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
static_resources:
  listeners:
  - name: ano
    address:
      socket_address: { address: 0.0.0.0, port_value: 10080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ano
          codec_type: AUTO
          route_config:
            name: ano
            virtual_hosts:
              - name: absent
                domains: ["*"]
                routes:
                - match: { prefix: "/" }
                  direct_response:
                    status: 404
                    body:
                      inline_string: "Ano has no approved route for this name.\n"
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: ano_answer
    connect_timeout: 1s
    type: LOGICAL_DNS
    dns_lookup_family: V4_PREFERRED
    load_assignment:
      cluster_name: ano_answer
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: host.docker.internal, port_value: 10081 }
